<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receiver Controller</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; text-align: center; }
    #result { font-size: 32px; font-weight: bold; color: #00ffcc; margin-top: 40px; word-wrap: break-word; }
    .status { color: #888; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Live Search Feed</h2>
  <div id="result">Waiting for search...</div>
  <div class="status" id="status">Connecting to Firebase...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      // നിങ്ങളുടെ Firebase Config ഇവിടെയും നൽകുക
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const resultDiv = document.getElementById('result');
    const statusDiv = document.getElementById('status');

    // സ്ക്രീൻ ഓഫ് ആകുമ്പോൾ വൈബ്രേഷൻ വർക്ക് ചെയ്യാൻ ഉള്ള ഫങ്ഷൻ
    function triggerVibration() {
      if ("vibrate" in navigator) {
        // [Vibrate, Pause, Vibrate] - 200ms ഓൺ, 100ms ഓഫ്, 200ms ഓൺ
        navigator.vibrate([200, 100, 200]);
      }
    }

    // സ്ക്രീൻ ഓഫ് ആകാതിരിക്കാൻ Wake Lock (Optional)
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
    document.addEventListener("click", requestWakeLock);

    const searchRef = ref(db, 'magic/search');
    onValue(searchRef, (snapshot) => {
      statusDiv.innerText = "Connected & Active";
      const data = snapshot.val();
      if (data && data.text) {
        resultDiv.innerText = data.text;
        triggerVibration(); // ഡാറ്റ വരുമ്പോൾ വൈബ്രേഷൻ ട്രിഗർ ആകും
      }
    });
  </script>
</body>
</html>
