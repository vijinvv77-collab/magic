<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Magic Receiver</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body style="background: black; color: green; font-family: monospace; padding: 20px;">
    <h3>Receiver Running...</h3>
    <p>ഫോൺ പോക്കറ്റിൽ വെക്കുക.</p>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCgY1QcZfvh4SoEdcVcSGl-_jdSCagH4sE",
            authDomain: "magicapp-7c8e1.firebaseapp.com",
            databaseURL: "https://magicapp-7c8e1-default-rtdb.firebaseio.com",
            projectId: "magicapp-7c8e1",
            storageBucket: "magicapp-7c8e1.firebasestorage.app",
            messagingSenderId: "26285258962",
            appId: "1:26285258962:web:c94661ee24dbf5cd35550b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('magic/currentName').on('value', (snapshot) => {
            const name = snapshot.val();
            if (name) {
                playVibrationPattern(name);
            }
        });

        function playVibrationPattern(word) {
            let pattern = [];
            
            for (let i = 0; i < word.length; i++) {
                let charCode = word.charCodeAt(i);
                if (charCode >= 65 && charCode <= 90) {
                    let count = charCode - 64;
                    
                    for (let j = 0; j < count; j++) {
                        pattern.push(100); 
                        pattern.push(150); 
                    }
                    pattern.push(1000);
                }
            }

            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }
    </script>
</body>
</html>
