<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Receiver</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body style="background: black; color: white; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>Magic Receiver</h2>
    <p>വൈബ്രേഷൻ ആക്റ്റീവ് ആക്കാൻ താഴെയുള്ള ബട്ടൺ അമർത്തുക:</p>
    
    <button id="startBtn" onclick="enableVibration()" style="padding: 18px 36px; font-size: 20px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">
        Start Listening
    </button>

    <h3 id="status" style="margin-top: 30px; color: #ffc107;">Stopped</h3>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCGy1QcZfvh4SoEdcVcSGl-_jdSCagH4sE",
            authDomain: "magicapp-7c8e1.firebaseapp.com",
            databaseURL: "https://magicapp-7c8e1-default-rtdb.firebaseio.com",
            projectId: "magicapp-7c8e1",
            storageBucket: "magicapp-7c8e1.appspot.com",
            messagingSenderId: "26285258962",
            appId: "1:26285258962:web:c94661ee24dbf5cd35550b"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let initialLoad = true;

        function enableVibration() {
            // ടെസ്റ്റ് വൈബ്രേഷൻ
            if ("vibrate" in navigator) {
                navigator.vibrate([150, 100, 150]);
            }
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('status').innerText = "Ready & Listening...";
            document.getElementById('status').style.color = "#28a745";

            // റീൽ ടൈം ലിസണർ
            database.ref('magic/thought').on('value', (snapshot) => {
                const word = snapshot.val();
                
                // ആദ്യത്തെ തവണ ലിങ്ക് ഓപ്പൺ ചെയ്യുമ്പോൾ പాత വാക്ക് വൈബ്രേറ്റ് ചെയ്യാതിരിക്കാൻ
                if (initialLoad) {
                    initialLoad = false;
                    return;
                }

                if (word && word.trim() !== "") {
                    document.getElementById('status').innerText = "Received: " + word;
                    generateVibrationPattern(word.trim().toUpperCase());
                }
            });
        }

        function generateVibrationPattern(word) {
            let pattern = [];

            for (let char of word) {
                let code = char.charCodeAt(0) - 64; // A=1, B=2, C=3...
                if (code >= 1 && code <= 26) {
                    for (let i = 0; i < code; i++) {
                        pattern.push(300); // 300ms വൈബ്രേഷൻ
                        pattern.push(300); // 300ms ഗ്യാപ്പ്
                    }
                    pattern.push(2000); // അടുത്ത അക്ഷരത്തിനായി 2 സെക്കൻഡ് ഗ്യാപ്പ്
                }
            }

            if ("vibrate" in navigator && pattern.length > 0) {
                navigator.vibrate(0); // നിലവിലുള്ളത് റീസെറ്റ് ചെയ്യുന്നു
                navigator.vibrate(pattern); // പുതിയ വൈബ്രേഷൻ കൊടുക്കുന്നു
            }
        }
    </script>
</body>
</html>
