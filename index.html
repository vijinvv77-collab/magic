<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Reader</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0d1117; color: white; font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; }
        input { padding: 15px; font-size: 18px; width: 80%; max-width: 300px; border-radius: 8px; border: 1px solid #333; text-align: center; margin-bottom: 20px; }
        button { padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>AI Thought Analyzer</h2>
    <p>Enter a word in your mind:</p>
    <input type="text" id="thoughtInput" placeholder="Type here..." autocomplete="off"><br>
    <button onclick="sendThought()">Analyze Thoughts</button>
    <p id="msg" style="color: #28a745; margin-top: 20px;"></p>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCGy1QcZfvh4SoEdcVcSGl-_jdSCagH4sE",
            authDomain: "magicapp-7c8e1.firebaseapp.com",
            databaseURL: "https://magicapp-7c8e1-default-rtdb.firebaseio.com",
            projectId: "magicapp-7c8e1",
            storageBucket: "magicapp-7c8e1.appspot.com",
            messagingSenderId: "26285258962",
            appId: "1:26285258962:web:c94661ee24dbf5cd35550b"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function sendThought() {
            const word = document.getElementById('thoughtInput').value.trim();
            if (word !== "") {
                database.ref('magic/thought').set(word.toUpperCase() + "_" + Date.now());
                document.getElementById('msg').innerText = "Analyzing thoughts... Please wait.";
                document.getElementById('thoughtInput').value = "";
            }
        }
    </script>
</body>
</html>
