<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Telepathy Engine</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 40px 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        input { width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; margin: 15px 0; outline: none; }
        button { background: #0284c7; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 15px; color: #a855f7; font-weight: bold; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="card">
        <h2>AI Telepathy Engine</h2>
        <p>നിങ്ങളുടെ മനസ്സിൽ വിചാരിച്ച പേര് ടൈപ്പ് ചെയ്യുക. AI നിങ്ങളുടെ ചിന്തകൾ വായിക്കും!</p>
        <input type="text" id="secretName" placeholder="Enter name here..." autocomplete="off">
        <button onclick="sendName()">Analyze Thoughts</button>
        <div id="status"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCgY1QcZfvh4SoEdcVcSGl-_jdSCagH4sE",
            authDomain: "magicapp-7c8e1.firebaseapp.com",
            databaseURL: "https://magicapp-7c8e1-default-rtdb.firebaseio.com",
            projectId: "magicapp-7c8e1",
            storageBucket: "magicapp-7c8e1.firebasestorage.app",
            messagingSenderId: "26285258962",
            appId: "1:26285258962:web:c94661ee24dbf5cd35550b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function sendName() {
            const name = document.getElementById('secretName').value.trim().toUpperCase();
            if(!name) return;
            
            db.ref('magic/currentName').set(name).then(() => {
                document.getElementById('status').innerText = "Analyzing neural signals... 99%";
            });
        }
    </script>
</body>
</html>
